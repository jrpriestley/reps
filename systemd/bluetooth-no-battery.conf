# Installed as /etc/systemd/system/bluetooth.service.d/reps.conf. BlueZ's battery plugin reads
# an iPhone's battery level on connecting; the phone protects that, so BlueZ tries to pair,
# fails and hangs up on the heart rate reps-heart came for. Delete the file to undo.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=battery
