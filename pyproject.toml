[project]
name = "reps"
version = "0.23.0"
description = "A home workout coach for two (runs on homehub)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []  # standard library only

[project.scripts]
reps = "reps.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]

[tool.ruff.lint.isort]
known-first-party = ["reps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # independent of the editable install
